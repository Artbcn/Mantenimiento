<style>
  :root{ --ink:#17313B; --teal:#0FA3A3; --bg:#f7fafa; --card:#fff; --line:#e2e8e8; --soft:#6f7d7d; --done:#128a4a; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent }
  body{ margin:0; font-family:'Outfit',system-ui,sans-serif; background:var(--bg); color:#20242a; padding-bottom:40px }
  header{ background:var(--ink); color:#fff; padding:16px 18px }
  header h1{ margin:0; font-size:22px; font-weight:800 } header h1 .t{ color:var(--teal) }
  header .sub{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:#b9c6cc; margin-top:2px }
  .daynav{ display:flex; align-items:center; justify-content:center; gap:14px; padding:12px; background:#fff; border-bottom:1px solid var(--line) }
  .daynav button{ border:1px solid var(--line); background:#fff; border-radius:10px; width:40px; height:40px; font-size:20px; cursor:pointer }
  .daynav .d{ font-weight:700; font-size:16px; min-width:150px; text-align:center }
  .wrap{ max-width:640px; margin:0 auto; padding:14px }
  h2{ font-size:15px; margin:22px 0 8px; border-bottom:1px solid var(--line); padding-bottom:6px }
  .item{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin:10px 0 }
  .chead{ display:flex; align-items:baseline; gap:10px; margin-bottom:10px }
  .hab{ font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:20px }
  .ctx{ color:var(--soft); font-size:13px }
  .tbtns{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px }
  .tbtn{ border:1px solid var(--line); background:#eef2f2; color:#39494a; border-radius:12px; padding:11px 15px; font-family:inherit; font-size:14px; font-weight:700; cursor:pointer }
  .tbtn.on{ background:var(--done); color:#fff; border-color:var(--done) }
  .anote{ width:100%; border:1px solid var(--line); border-radius:10px; padding:9px 11px; font-family:inherit; font-size:14px }
  .none{ color:var(--soft); padding:10px 2px; font-style:italic }
  .summary{ position:sticky; bottom:0; background:var(--ink); color:#fff; text-align:center; padding:12px; font-weight:700; margin-top:24px; border-radius:12px }
  .banner{ background:var(--teal); color:#04312f; text-align:center; padding:10px; font-weight:700; cursor:pointer }
  .cfgwarn{ background:#fbe9e7; color:#8a2a1e; padding:12px 14px; text-align:center; font-weight:600 }
  .xf{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px }
  .xf input{ border:1px solid var(--line); border-radius:10px; padding:10px; font-family:inherit; font-size:14px }
  .xf .h{ width:90px } .xf .n{ flex:1; min-width:120px }
  .xf .ok{ background:var(--teal); color:#fff; border:none; border-radius:10px; padding:0 16px; font-weight:700; cursor:pointer }
  .del{ border:none; background:transparent; color:#c0392b; font-size:16px; cursor:pointer; padding:4px 8px }
  .tag{ display:inline-block; font-size:11px; font-weight:700; padding:2px 7px; border-radius:20px; margin-left:6px; background:#e3f4f4; color:#0c7d7d }
</style></head>
<body>
<header><h1>ART <span class="t">Mantenimiento</span> &#128295;</h1><div class="sub">marca cada tarea como hecha &middot; se guarda solo</div></header>
<div id="cfgWarn" class="cfgwarn" style="display:none">Falta configurar la conexion.</div>
<div id="syncBanner" class="banner" style="display:none">El parte cambio - toca para actualizar</div>
<div class="daynav"><button id="prevDay">&#8249;</button><div class="d" id="dayLabel">-</div><button id="nextDay">&#8250;</button></div>
<div class="wrap" id="wrap"><div class="none">Cargando...</div></div>
<script>
"use strict";
const SB_URL = "https://nevhnfkbrwwelmokspzt.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ldmhuZmticnd3ZWxtb2tzcHp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3MzA0NDgsImV4cCI6MjEwMDMwNjQ0OH0.fk05FBrzZZoqtBvz--jeWBWiHmbi6U-rSY4uzJXCMQY";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const CHK = "\u2713 ";
const SB_TAB = Math.random().toString(36).slice(2);
let sb = null;
try{ if (SB_URL && SB_KEY && window.supabase) sb = window.supabase.createClient(SB_URL, SB_KEY); }catch(e){ sb = null; }
if (!sb) $("cfgWarn").style.display = "block";
const pad = n => String(n).padStart(2,"0");
const toISO = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromISO = s => { const p = s.split("-").map(Number); return new Date(p[0], p[1]-1, p[2]); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const DIAS = ["domingo","lunes","martes","miercoles","jueves","viernes","sabado"];
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const humanDate = iso => { const d = fromISO(iso); return DIAS[d.getDay()]+" "+d.getDate()+" "+MESES[d.getMonth()]; };
function opToday(){ const d = new Date(); if (d.getHours() < 5) d.setDate(d.getDate() - 1); return toISO(d); }
let curISO = opToday();
let parte = null, cmap = {};

async function load(){
  parte = null; cmap = {};
  if (!sb){ render(); return; }
  try{ const r = await sb.from("mant_parte").select("data").eq("fecha", curISO).maybeSingle(); parte = (r.data && r.data.data) || null; }catch(e){ parte = null; }
  try{ const r = await sb.from("mant_cierre").select("*").eq("fecha", curISO); for (const c of (r.data||[])) cmap[c.kind+"|"+c.hab] = c; }catch(e){}
  render();
}
async function setTaskDone(fullKey, hecho){
  const c = cmap[fullKey] || {};
  const kind = fullKey.split("|")[0]; const hab = fullKey.slice(kind.length+1);
  const row = { id: curISO+"|"+kind+"|"+hab, fecha: curISO, kind, hab, hecho, nota: c.nota||"", src: SB_TAB, updated_at: new Date().toISOString() };
  cmap[fullKey] = row; if (sb){ try{ await sb.from("mant_cierre").upsert(row); }catch(e){} }
}
async function setAptoNote(base, nota){
  const k = "mp_note|"+base; const c = cmap[k] || {};
  const row = { id: curISO+"|mp_note|"+base, fecha: curISO, kind: "mp_note", hab: base, hecho: false, nota, src: SB_TAB, updated_at: new Date().toISOString() };
  cmap[k] = row; if (sb){ try{ await sb.from("mant_cierre").upsert(row); }catch(e){} }
}
async function addFound(hab, nota){
  const id = curISO+"|mp_found|"+hab+"-"+Date.now().toString(36);
  const row = { id, fecha: curISO, kind:"mp_found", hab, hecho:true, nota, src:SB_TAB, updated_at:new Date().toISOString() };
  if (sb){ try{ await sb.from("mant_cierre").upsert(row); }catch(e){} }
  await load();
}
async function delFound(id){ if (sb){ try{ await sb.from("mant_cierre").delete().eq("id", id); }catch(e){} } await load(); }

function tasksOf(kind, x){
  if (kind==="mp_general") return (x.tareas||[]).length ? x.tareas : ["Mantenimiento general"];
  if (kind==="mp_puntual") return [ x.nota || "Revisar" ];
  if (kind==="mp_cliente") return [ x.nota || "Incidencia" ];
  if (kind==="mp_shared" || kind==="mp_manual") return x.tareas || [];
  return [ x.desc || x.tipo || "Tarea" ];
}
function taskBtn(kind, base, label){
  const key = kind+"|"+base+"\u00a7"+label;
  const done = !!(cmap[key] && cmap[key].hecho);
  return '<button class="tbtn '+(done?"on":"off")+'" data-key="'+esc(key)+'" data-label="'+esc(label)+'">'+(done?CHK:"")+esc(label)+'</button>';
}
function noteField(base){
  const c = cmap["mp_note|"+base]; const v = c && c.nota ? esc(c.nota) : "";
  return '<input class="anote" data-base="'+esc(base)+'" placeholder="nota del apartamento (opcional)" value="'+v+'">';
}
function card(kind, base, apto, ctx, tasks){
  const btns = tasks.map(t => taskBtn(kind, base, t)).join("");
  return '<div class="item"><div class="chead"><span class="hab">'+esc(apto)+'</span>'+(ctx?'<span class="ctx">'+esc(ctx)+'</span>':"")+'</div>'
    + '<div class="tbtns">'+btns+'</div>'+noteField(base)+'</div>';
}
function foundSection(){
  return '<h2>&#128269; Encontre / hice algo mas</h2><div id="foundList"></div>'
    + '<div class="xf"><input class="h" id="fHab" placeholder="Apto" inputmode="numeric"><input class="n" id="fNota" placeholder="que encontraste o hiciste"><button class="ok" id="fOk">Agregar</button></div>';
}
function allKeys(P,G,C,X,SH,MN){
  SH = SH || []; MN = MN || [];
  const ks = [];
  SH.forEach(x => tasksOf("mp_shared",x).forEach(t => ks.push("mp_shared|_general\u00a7"+t)));
  P.forEach(x => tasksOf("mp_puntual",x).forEach(t => ks.push("mp_puntual|"+x.hab+"\u00a7"+t)));
  G.forEach(x => tasksOf("mp_general",x).forEach(t => ks.push("mp_general|"+x.hab+"\u00a7"+t)));
  MN.forEach(x => tasksOf("mp_manual",x).forEach(t => ks.push("mp_manual|"+x.hab+"\u00a7"+t)));
  C.forEach(x => tasksOf("mp_cliente",x).forEach(t => ks.push("mp_cliente|"+x.hab+"\u00a7"+t)));
  X.forEach(x => tasksOf("mp_extra",x).forEach(t => ks.push("mp_extra|"+x.id+"\u00a7"+t)));
  return ks;
}
function summary(P,G,C,X,SH,MN){
  const ks = allKeys(P,G,C,X,SH,MN); let done = 0; ks.forEach(k => { if (cmap[k] && cmap[k].hecho) done++; });
  return '<div class="summary">'+done+" de "+ks.length+" hechas</div>";
}
function refreshSummary(){
  const s = document.querySelector(".summary"); if (!s || !parte) return;
  const SH = (parte.compartidas||[]).length ? [{ hab:"General", tareas:parte.compartidas }] : [];
  const ks = allKeys(parte.puntual||[],parte.general||[],parte.cliente||[],parte.extras||[],SH,parte.manual||[]);
  let done=0; ks.forEach(k=>{ if(cmap[k]&&cmap[k].hecho)done++; });
  s.textContent = done+" de "+ks.length+" hechas";
}
function render(){
  const w = $("wrap"); $("dayLabel").textContent = humanDate(curISO);
  if (!sb){ w.innerHTML = '<div class="none">Sin conexion.</div>'; return; }
  if (!parte){ w.innerHTML = '<div class="none">Todavia no hay parte para este dia.</div>' + foundSection(); wireFound(); return; }
  const P = parte.puntual||[], G = parte.general||[], C = parte.cliente||[], X = parte.extras||[];
  const SH = (parte.compartidas||[]).length ? [{ hab:"General", tareas:parte.compartidas }] : [];
  const MN = parte.manual||[];
  let html = "";
  if (SH.length){ html += '<h2>&#128203; General del d\u00eda</h2>'; html += SH.map(x => card("mp_shared", "_general", "General", "", tasksOf("mp_shared",x))).join(""); }
  html += '<h2>&#128295; Puntual (ventana) <span style="color:var(--soft)">('+P.length+')</span></h2>';
  html += P.length ? P.map(x => card("mp_puntual", x.hab, x.hab, x.huesped, tasksOf("mp_puntual",x))).join("") : '<div class="none">Sin puntuales.</div>';
  html += '<h2>&#128736; General (aptos libres) <span style="color:var(--soft)">('+G.length+')</span></h2>';
  html += G.length ? G.map(x => card("mp_general", x.hab, x.hab, "", tasksOf("mp_general",x))).join("") : '<div class="none">Sin generales.</div>';
  if (MN.length){ html += '<h2>&#128221; Tareas pegadas <span style="color:var(--soft)">('+MN.length+')</span></h2>'; html += MN.map(x => card("mp_manual", x.hab, x.hab, x.ctx||"", tasksOf("mp_manual",x))).join(""); }
  if (X.length){ html += '<h2>&#10133; Incidencias <span style="color:var(--soft)">('+X.length+')</span></h2>'; html += X.map(x => card("mp_extra", x.id, x.hab, x.tipo, tasksOf("mp_extra",x))).join(""); }
  html += foundSection();
  html += summary(P,G,C,X,SH,MN);
  w.innerHTML = html; wireItems(); wireFound();
}
function wireItems(){
  document.querySelectorAll(".tbtn").forEach(btn => btn.addEventListener("click", async () => {
    const nowDone = !btn.classList.contains("on");
    await setTaskDone(btn.dataset.key, nowDone);
    btn.className = "tbtn " + (nowDone?"on":"off");
    btn.textContent = (nowDone?CHK:"") + btn.dataset.label;
    refreshSummary();
  }));
  document.querySelectorAll(".anote").forEach(inp => { let t=null; inp.addEventListener("input", () => { clearTimeout(t); t=setTimeout(()=>setAptoNote(inp.dataset.base, inp.value.trim()),500); }); });
}
async function wireFound(){
  if (sb){
    try{
      const r = await sb.from("mant_cierre").select("*").eq("fecha",curISO).eq("kind","mp_found");
      const list = $("foundList");
      if (list){
        const rows = r.data||[];
        list.innerHTML = rows.map(c => '<div class="item"><div class="chead"><span class="hab">'+esc(c.hab)+'</span><span class="ctx">'+esc(c.nota||"algo")+'<span class="tag">extra</span></span><button class="del" data-id="'+esc(c.id)+'">\u2715</button></div></div>').join("");
        list.querySelectorAll(".del").forEach(b => b.addEventListener("click", () => delFound(b.dataset.id)));
      }
    }catch(e){}
  }
  const ok = $("fOk");
  if (ok) ok.addEventListener("click", async () => { const hab=($("fHab").value||"").trim(); if(!hab){$("fHab").focus();return;} await addFound(hab, ($("fNota").value||"").trim()); });
}
$("prevDay").addEventListener("click", () => { curISO = toISO(addDays(fromISO(curISO),-1)); load(); });
$("nextDay").addEventListener("click", () => { curISO = toISO(addDays(fromISO(curISO), 1)); load(); });
function subscribe(){
  if (!sb) return;
  try{ sb.channel("mp_parte").on("postgres_changes",{event:"*",schema:"public",table:"mant_parte"},p=>{ const row=p.new||p.old||{}; if(row.fecha===curISO) $("syncBanner").style.display="block"; }).subscribe(); }catch(e){}
  try{ sb.channel("mp_cierre").on("postgres_changes",{event:"*",schema:"public",table:"mant_cierre"},p=>{ const row=p.new||p.old||{}; if(row.src===SB_TAB) return; if(row.fecha===curISO) load(); }).subscribe(); }catch(e){}
}
$("syncBanner").addEventListener("click", () => { $("syncBanner").style.display="none"; load(); });
async function init(){
  await load();  /* arranca en HOY */
  if (!parte && sb){ try{ const r = await sb.from("mant_parte").select("fecha").order("fecha",{ascending:false}).limit(1); if (r.data && r.data.length){ curISO = r.data[0].fecha; await load(); } }catch(e){} }
  subscribe();
}
init();
</script></body></html>
